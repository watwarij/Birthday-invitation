<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#b77b82"
  >

  <title>You're Invited — 21st Birthday</title>

  <style>

    /* =========================================================
       GOOGLE FONTS
       ========================================================= */

    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap');


    /* =========================================================
       VARIABLES — PINK & KHAKI
       ========================================================= */

    :root {

      --bg: #191614;

      --bg-soft: #211d1a;

      --card: #29231f;

      --khaki: #b7a68a;

      --khaki-light: #d8cbb2;

      --pink: #c98f98;

      --pink-light: #e5b5bb;

      --pink-dark: #9e6972;

      --white: #faf5f1;

      --muted: #b8ada5;

      --danger: #d98686;

      --success: #a9c5a0;

    }


    /* =========================================================
       RESET
       ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% 10%,
          rgba(201, 143, 152, 0.16),
          transparent 35%
        ),
        radial-gradient(
          circle at 15% 70%,
          rgba(183, 166, 138, 0.08),
          transparent 30%
        ),
        var(--bg);

      color: var(--white);

      font-family:
        'Montserrat',
        sans-serif;

      overflow-x: hidden;
    }


    body.locked {
      overflow: hidden;
    }


    button,
    input {
      font-family: inherit;
    }


    /* =========================================================
       PASSWORD SCREEN
       ========================================================= */

    #password-screen {

      min-height: 100vh;

      display: flex;

      justify-content: center;
      align-items: center;

      padding: 25px;

      position: fixed;

      inset: 0;

      z-index: 10000;

      background:
        radial-gradient(
          circle at center,
          rgba(201, 143, 152, 0.12),
          transparent 45%
        ),
        var(--bg);

      transition:
        opacity 0.8s ease,
        visibility 0.8s ease;
    }


    #password-screen.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    .password-card {

      width: 100%;

      max-width: 430px;

      padding: 55px 35px;

      text-align: center;

      border:
        1px solid
        rgba(201, 143, 152, 0.4);

      background:
        rgba(41, 35, 31, 0.9);

      backdrop-filter: blur(18px);

      border-radius: 6px;

      box-shadow:
        0 30px 90px
        rgba(0, 0, 0, 0.55);

      animation:
        passwordCardIn
        1s
        ease
        forwards;
    }


    @keyframes passwordCardIn {

      from {

        opacity: 0;

        transform:
          translateY(30px)
          scale(0.97);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    .small-title {

      color: var(--pink);

      letter-spacing: 5px;

      font-size: 10px;

      font-weight: 500;

      margin-bottom: 25px;
    }


    .number {

      font-family:
        'Cormorant Garamond',
        serif;

      font-size: 135px;

      line-height: 0.75;

      color: var(--pink-light);

      font-weight: 400;

      text-shadow:
        0 0 45px
        rgba(201, 143, 152, 0.15);
    }


    .birthday {

      font-family:
        'Cormorant Garamond',
        serif;

      font-size: 30px;

      letter-spacing: 5px;

      margin-top: 25px;

      color: var(--white);
    }


    .password-description {

      color: var(--muted);

      font-size: 12px;

      line-height: 1.8;

      margin: 30px auto;

      max-width: 280px;
    }


    .hint {

      color: var(--khaki-light);

      font-size: 10px;

      letter-spacing: 2px;

      margin-top: 20px;

      margin-bottom: 15px;
    }


    .password-input {

      width: 100%;

      padding: 15px;

      background:
        rgba(255,255,255,0.02);

      border:
        1px solid
        rgba(183,166,138,0.35);

      color: var(--white);

      text-align: center;

      letter-spacing: 5px;

      outline: none;

      transition: 0.3s;

      border-radius: 2px;
    }


    .password-input::placeholder {
      color: #77706b;
    }


    .password-input:focus {

      border-color:
        var(--pink);

      box-shadow:
        0 0 25px
        rgba(201, 143, 152, 0.1);
    }


    .unlock-button {

      width: 100%;

      margin-top: 12px;

      padding: 15px;

      border:
        1px solid
        var(--pink);

      background:
        var(--pink);

      color: #241b1b;

      font-weight: 600;

      letter-spacing: 2px;

      cursor: pointer;

      transition: 0.3s;

      border-radius: 2px;
    }


    .unlock-button:hover {

      background:
        var(--pink-light);

      border-color:
        var(--pink-light);

      transform:
        translateY(-2px);

      box-shadow:
        0 10px 30px
        rgba(201, 143, 152, 0.15);
    }


    .unlock-button:disabled {

      opacity: 0.55;

      cursor: wait;

      transform: none;
    }


    .attempts {

      color: #77706b;

      font-size: 9px;

      letter-spacing: 1px;

      margin-top: 14px;
    }


    .error {

      color:
        var(--danger);

      font-size: 11px;

      margin-top: 15px;

      min-height: 14px;

      opacity: 0;

      transition: 0.3s;
    }


    .error.show {
      opacity: 1;
    }


    /* =========================================================
       ENVELOPE TRANSITION
       ========================================================= */

    #envelope-transition {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      justify-content: center;

      align-items: center;

      background:
        radial-gradient(
          circle at center,
          #493337 0%,
          #241d1b 38%,
          #151311 75%
        );

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
    }


    #envelope-transition.active {

      opacity: 1;

      visibility: visible;

      pointer-events: all;
    }


    #envelope-transition.fade-out {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transition:
        opacity 1s ease,
        visibility 1s ease;
    }


    .envelope-scene {

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    /* =========================================================
       ENVELOPE
       ========================================================= */

    .envelope {

      position: relative;

      width: 320px;

      height: 210px;

      perspective: 1000px;

      filter:
        drop-shadow(
          0 30px 50px
          rgba(0, 0, 0, 0.65)
        );
    }


    .envelope-back {

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          135deg,
          #776a57,
          #514837
        );

      border:
        1px solid
        rgba(229, 181, 187, 0.5);

      border-radius: 4px;

      z-index: 1;
    }


    .envelope-letter {

      position: absolute;

      left: 20px;

      right: 20px;

      bottom: 15px;

      height: 175px;

      background:
        #f8eee9;

      color:
        #332725;

      z-index: 2;

      transform:
        translateY(0);

      transition:
        transform
        1.1s
        cubic-bezier(.22,1,.36,1);

      box-shadow:
        0 10px 30px
        rgba(0,0,0,0.3);
    }


    .letter-content {

      height: 100%;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      gap: 8px;

      font-family:
        'Cormorant Garamond',
        serif;
    }


    .letter-content span {

      font-family:
        'Montserrat',
        sans-serif;

      font-size: 9px;

      letter-spacing: 4px;

      color:
        var(--pink-dark);
    }


    .letter-content strong {

      font-size: 85px;

      line-height: 0.8;

      font-weight: 400;

      color:
        #9d6e75;
    }


    .envelope-front {

      position: absolute;

      inset: 0;

      z-index: 4;

      background:
        linear-gradient(
          145deg,
          transparent 49.5%,
          #665a49 50%
        );

      clip-path:
        polygon(
          0 0,
          50% 58%,
          100% 0,
          100% 100%,
          0 100%
        );

      border-bottom:
        1px solid
        rgba(229,181,187,0.35);
    }


    .envelope-flap {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 115px;

      z-index: 5;

      background:
        linear-gradient(
          135deg,
          #95866d,
          #665a48
        );

      clip-path:
        polygon(
          0 0,
          100% 0,
          50% 100%
        );

      transform-origin:
        top center;

      border-top:
        1px solid
        rgba(229,181,187,0.55);

      transition:
        transform
        1s
        cubic-bezier(.22,1,.36,1);
    }


    #envelope-transition.open
    .envelope-flap {

      transform:
        rotateX(180deg);

      z-index: 1;
    }


    #envelope-transition.open
    .envelope-letter {

      transform:
        translateY(-115px);

      transition-delay:
        0.35s;
    }


    .opening-text {

      margin-top: 60px;

      color:
        var(--pink-light);

      font-size: 9px;

      letter-spacing: 5px;

      opacity: 0;

      animation:
        openingTextIn
        1s
        ease
        forwards;

      animation-delay:
        0.5s;
    }


    @keyframes openingTextIn {

      from {

        opacity: 0;

        transform:
          translateY(10px);
      }

      to {

        opacity: 0.8;

        transform:
          translateY(0);
      }

    }


    /* =========================================================
       INVITATION
       ========================================================= */

    #invitation {

      opacity: 0;

      animation:
        invitationIn
        1.5s
        ease
        forwards;
    }


    @keyframes invitationIn {

      from {

        opacity: 0;

        transform:
          translateY(20px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =========================================================
       HERO
       ========================================================= */

    .hero {

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding: 60px 20px;

      position: relative;

      overflow: hidden;
    }


    .hero::before {

      content: "";

      position: absolute;

      width: 600px;

      height: 600px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(201,143,152,0.14),
          transparent 65%
        );

      pointer-events: none;
    }


    .hero-content {

      position: relative;

      z-index: 2;
    }


    .hero-subtitle {

      color:
        var(--pink);

      font-size: 11px;

      letter-spacing: 7px;

      margin-bottom: 30px;
    }


    .hero-21 {

      font-family:
        'Cormorant Garamond',
        serif;

      font-size:
        clamp(
          160px,
          35vw,
          310px
        );

      line-height: 0.65;

      font-weight: 400;

      color: transparent;

      -webkit-text-stroke:
        1px
        var(--pink);

      text-shadow:
        0 0 50px
        rgba(201,143,152,0.12);
    }


    .hero-title {

      font-family:
        'Cormorant Garamond',
        serif;

      font-size:
        clamp(
          40px,
          8vw,
          75px
        );

      font-weight: 500;

      margin-top: 50px;

      letter-spacing: 4px;
    }


    .hero-date {

      margin-top: 25px;

      font-size: 13px;

      letter-spacing: 4px;

      color:
        var(--khaki-light);
    }


    .scroll {

      position: absolute;

      bottom: 30px;

      left: 50%;

      transform:
        translateX(-50%);

      font-size: 9px;

      letter-spacing: 4px;

      color:
        var(--muted);

      white-space: nowrap;
    }


    /* =========================================================
       SECTIONS
       ========================================================= */

    .section {

      max-width: 850px;

      margin: auto;

      padding: 110px 25px;

      text-align: center;
    }


    .section-label {

      color:
        var(--pink);

      font-size: 10px;

      letter-spacing: 5px;

      margin-bottom: 25px;
    }


    .section h2 {

      font-family:
        'Cormorant Garamond',
        serif;

      font-size: 48px;

      font-weight: 500;

      margin-bottom: 25px;
    }


    .section p {

      max-width: 600px;

      margin: auto;

      color:
        var(--muted);

      line-height: 2;

      font-size: 14px;
    }


    /* =========================================================
       DETAILS
       ========================================================= */

    .details {

      margin-top: 55px;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 1px;

      background:
        rgba(183,166,138,0.25);

      border:
        1px solid
        rgba(183,166,138,0.25);
    }


    .detail {

      background:
        var(--card);

      padding: 40px 20px;

      transition:
        background 0.3s,
        transform 0.3s;
    }


    .detail:hover {

      background:
        #302925;

      transform:
        translateY(-3px);
    }


    .detail-icon {

      font-size: 22px;

      margin-bottom: 15px;

      color:
        var(--pink);
    }


    .detail-title {

      color:
        var(--khaki-light);

      font-size: 10px;

      letter-spacing: 3px;

      margin-bottom: 10px;
    }


    .detail-text {

      font-family:
        'Cormorant Garamond',
        serif;

      font-size: 22px;

      color:
        var(--white);
    }


    .detail-small {

      color:
        var(--muted);

      font-size: 11px;

      margin-top: 7px;

      line-height: 1.5;
    }


    /* =========================================================
       COUNTDOWN
       ========================================================= */

    .countdown {

      margin-top: 50px;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;
    }


    .countdown-box {

      padding: 25px 10px;

      background:
        rgba(201,143,152,0.06);

      border:
        1px solid
        rgba(201,143,152,0.18);
    }


    .countdown-number {

      display: block;

      font-family:
        'Cormorant Garamond',
        serif;

      font-size: 40px;

      color:
        var(--pink-light);
    }


    .countdown-label {

      font-size: 8px;

      letter-spacing: 2px;

      color:
        var(--muted);
    }


    /* =========================================================
       RSVP
       ========================================================= */

    .rsvp {

      border-top:
        1px solid
        rgba(183,166,138,0.2);

      border-bottom:
        1px solid
        rgba(183,166,138,0.2);
    }


    .rsvp-button {

      display: inline-block;

      margin-top: 35px;

      padding: 16px 45px;

      border:
        1px solid
        var(--pink);

      color:
        var(--pink-light);

      text-decoration: none;

      letter-spacing: 3px;

      font-size: 11px;

      transition: 0.3s;

      margin-right: 8px;

      margin-left: 8px;
    }


    .rsvp-button:hover {

      background:
        var(--pink);

      color:
        #21191a;
    }


    .rsvp-button.secondary {

      border-color:
        var(--khaki);

      color:
        var(--khaki-light);
    }


    .rsvp-button.secondary:hover {

      background:
        var(--khaki);

      color:
        #211e19;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    footer {

      text-align: center;

      padding: 60px 20px;

      color:
        #706963;

      font-size: 10px;

      letter-spacing: 3px;
    }


    footer span {

      color:
        var(--pink);
    }


    /* =========================================================
       FLOATING PARTICLES
       ========================================================= */

    .particle {

      position: fixed;

      width: 3px;

      height: 3px;

      background:
        var(--pink);

      border-radius: 50%;

      opacity: 0.3;

      pointer-events: none;

      animation:
        float 8s
        linear
        infinite;

      z-index: 999;
    }


    .particle.khaki {

      background:
        var(--khaki-light);
    }


    @keyframes float {

      from {

        transform:
          translateY(100vh);

        opacity: 0;
      }

      20% {

        opacity: 0.4;
      }

      80% {

        opacity: 0.2;
      }

      to {

        transform:
          translateY(-10vh);

        opacity: 0;
      }

    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 650px) {

      .password-card {

        padding:
          45px 25px;
      }


      .number {

        font-size: 105px;
      }


      .birthday {

        font-size: 24px;
      }


      .details {

        grid-template-columns:
          1fr;
      }


      .detail {

        padding: 30px;
      }


      .hero-title {

        margin-top: 40px;
      }


      .envelope {

        width: 280px;

        height: 185px;
      }


      .envelope-flap {

        height: 100px;
      }


      .envelope-letter {

        height: 155px;
      }


      .letter-content strong {

        font-size: 70px;
      }


      .opening-text {

        font-size: 8px;

        letter-spacing: 4px;
      }


      .countdown {

        grid-template-columns:
          repeat(2, 1fr);
      }


      .rsvp-button {

        display: block;

        margin:
          15px auto;

        max-width: 280px;
      }

    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;

        scroll-behavior:
          auto !important;
      }

    }

  </style>

</head>


<body class="locked">


  <!-- =======================================================
       PASSWORD SCREEN
       ======================================================= -->

  <section id="password-screen">

    <div class="password-card">

      <div class="small-title">
        PRIVATE INVITATION
      </div>

      <div class="number">
        21
      </div>

      <div class="birthday">
        BIRTHDAY
      </div>

      <p class="password-description">
        This invitation is private.
        Enter the password to reveal your invitation.
      </p>

      <div class="hint">
        HINT: MY BIRTHDAY
      </div>

      <input
        type="password"
        id="password"
        class="password-input"
        placeholder="PASSWORD"
        autocomplete="off"
        spellcheck="false"
      >

      <button
        id="unlock-button"
        class="unlock-button"
        type="button"
      >
        UNLOCK INVITATION
      </button>

      <div
        id="error"
        class="error"
        aria-live="polite"
      >
        Incorrect password. Please try again.
      </div>

      <div
        id="attempts"
        class="attempts"
      >
        3 attempts remaining
      </div>

    </div>

  </section>



  <!-- =======================================================
       ENVELOPE TRANSITION
       ======================================================= -->

  <div
    id="envelope-transition"
    aria-hidden="true"
  >

    <div class="envelope-scene">

      <div class="envelope">

        <div class="envelope-back"></div>

        <div class="envelope-letter">

            <span>

        </div>

        <div class="envelope-flap"></div>

      </div>

      <div class="opening-text">

      </div>

    </div>

  </div>



  <!-- =======================================================

       IMPORTANT:

       started.
       ======================================================= -->

  <template id="invitation-template">

    <main id="invitation">


      <!-- ===================================================
           HERO
           =================================================== -->

      <section class="hero">

        <div class="hero-content">

          <div class="hero-subtitle">
            YOU'RE INVITED
          </div>

          <div class="hero-21">
            21
          </div>

          <!-- CHANGE NAME HERE -->

          <h1 class="hero-title">
            [YOUR NAME]'S<br>
            BIRTHDAY

          <!-- CHANGE DATE HERE -->

            14 OCTOBER 2026
          </div>

        </div>

        <div class="scroll">
          SCROLL TO DISCOVER
        </div>

      </section>



      <!-- ===================================================

           =================================================== -->

        </p>

      </section>



      <!-- ===================================================

           =================================================== -->

      <section class="section">

        <div class="section-label">

        </div>

        <h2>
          Save the date.
        </h2>

        <div class="details">


          <!-- DATE -->

          <div class="detail">

            <div class="detail-icon">

            </div>

            </div>

            <div class="detail-small">
              Wednesday
            </div>

          </div>


          <!-- TIME -->

          <div class="detail">

            <div class="detail-icon">
              ◷
            </div>

            <div class="detail-title">
              TIME
            </div>

            <div class="detail-text">
              18:00
            </div>

            <div class="detail-small">
              Please arrive from 17:30
            </div>

          </div>


          <!-- LOCATION -->

          <div class="detail">

            <div class="detail-icon">
              ◇
            </div>

            <div class="detail-title">
              LOCATION
            </div>

            <div class="detail-text">
              [VENUE NAME]
            </div>

            <div class="detail-small">
              [CITY / ADDRESS]
            </div>

          </div>

        </div>

      </section>



      <!-- ===================================================
           COUNTDOWN

  <!-- =======================================================
       JAVASCRIPT
       ======================================================= -->

  <script>


    /* =======================================================
       SETTINGS
       ======================================================= */

    /*
      CHANGE YOUR PASSWORD HERE.

      Example:
      "14october"

      IMPORTANT:
      This is client-side protection only.
      Anyone who can inspect the HTML can technically
      discover the password.
    */

    const CORRECT_PASSWORD = "14october";


    /*
      Maximum incorrect attempts.
    */

    const MAX_ATTEMPTS = 3;


    /*
      Countdown date.

      CHANGE THIS IF NEEDED.

      Format:
      YYYY-MM-DDTHH:MM:SS

      This example is:
      14 October 2026 at 18:00
    */

    const EVENT_DATE =
      "2026-10-14T18:00:00";


    /* =======================================================
       ELEMENTS
       ======================================================= */

    const passwordScreen =
      document.getElementById(
        "password-screen"
      );


    const passwordInput =
      document.getElementById(
        "password"
      );


    const unlockButton =
      document.getElementById(
        "unlock-button"
      );


    const error =
      document.getElementById(
        "error"
      );


    const attemptsDisplay =
      document.getElementById(
        "attempts"
      );


    const envelopeTransition =
      document.getElementById(
        "envelope-transition"
      );


    const invitationTemplate =
      document.getElementById(
        "invitation-template"
      );


    /* =======================================================
       ATTEMPT SYSTEM
       ======================================================= */

    let attempts = 0;

    let lockedOut = false;


    function updateAttempts() {

      const remaining =
        MAX_ATTEMPTS - attempts;

      if (remaining > 0) {

        attemptsDisplay.textContent =
          `${remaining} ${
            remaining === 1
              ? "attempt"
              : "attempts"
          } remaining`;

      } else {

        attemptsDisplay.textContent =
          "Too many attempts.";

      }

    }


    /* =======================================================
       ERROR MESSAGE
       ======================================================= */

    function showError(message) {

      error.textContent =
        message;

      error.classList.add("show");

    }


    function hideError() {

      error.classList.remove("show");

    }


    /* =======================================================
       UNLOCK FUNCTION
       ======================================================= */

    function unlockInvitation() {


      /*
        Prevent interaction during lockout.
      */

      if (lockedOut) {
        return;
      }


      const enteredPassword =
        passwordInput.value.trim();


      /*
        INCORRECT PASSWORD
      */

      if (
        enteredPassword !==
        CORRECT_PASSWORD
      ) {

        attempts++;

        updateAttempts();

        passwordInput.value = "";

        passwordInput.focus();


        if (
          attempts >=
          MAX_ATTEMPTS
        ) {

          lockedOut = true;

          unlockButton.disabled =
            true;

          passwordInput.disabled =
            true;

          showError(
            "Too many incorrect attempts. Please wait 15 seconds."
          );


          /*
            15-second temporary lockout.
          */

          setTimeout(() => {

            attempts = 0;

            lockedOut = false;

            unlockButton.disabled =
              false;

            passwordInput.disabled =
              false;

            passwordInput.value =
              "";

            hideError();

            updateAttempts();

            passwordInput.focus();

          }, 15000);


        } else {

          showError(
            "Incorrect password. Please try again."
          );

        }

        return;
      }


      /*
        ======================================================
        CORRECT PASSWORD
        ======================================================
      */

      unlockButton.disabled =
        true;

      passwordInput.disabled =
        true;

      hideError();


      /*
        STEP 1
        Fade away the password screen.
      */

      passwordScreen.classList.add(
        "hidden"
      );


      /*
        STEP 2
        Show the envelope.

        IMPORTANT:
        The invitation is STILL NOT inserted
        into the page at this point.
      */

      envelopeTransition.classList.add(
        "active"
      );


      /*
        STEP 3
        Allow the envelope to appear
        before opening it.
      */

      setTimeout(() => {

        envelopeTransition.classList.add(
          "open"
        );

      }, 700);


      /*
        STEP 4
        Wait until the envelope has opened.

        Only NOW do we insert the invitation.
      */

      setTimeout(() => {

        const invitation =
          invitationTemplate.content.cloneNode(
            true
          );


        document.body.appendChild(
          invitation
        );


        document.body.classList.remove(
          "locked"
        );


        /*
          Start countdown after invitation
          has been inserted.
        */

        startCountdown();


        /*
          STEP 5
          Let the invitation begin appearing,
          then fade the envelope away.
        */

        setTimeout(() => {

          envelopeTransition.classList.add(
            "fade-out"
          );

        }, 400);


      }, 2700);

    }


    /* =======================================================
       BUTTON
       ======================================================= */

    unlockButton.addEventListener(
      "click",
      unlockInvitation
    );


    /* =======================================================
       ENTER KEY
       ======================================================= */

    passwordInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key ===
          "Enter"
        ) {

          unlockInvitation();

        }

      }
    );


    /* =======================================================
       COUNTDOWN
       ======================================================= */

    function startCountdown() {

      const targetDate =
        new Date(EVENT_DATE).getTime();


      function updateCountdown() {

        const now =
          new Date().getTime();


        const difference =
          targetDate - now;


        const days =
          document.getElementById(
            "days"
          );


        const hours =
          document.getElementById(
            "hours"
          );


        const minutes =
          document.getElementById(
            "minutes"
          );


        const seconds =
          document.getElementById(
            "seconds"
          );


        if (
          !days ||
          !hours ||
          !minutes ||
          !seconds
        ) {

          return;

        }


        if (difference <= 0) {

          days.textContent =
            "00";

          hours.textContent =
            "00";

          minutes.textContent =
            "00";

          seconds.textContent =
            "00";

          return;

        }


        const daysValue =
          Math.floor(
            difference /
            (1000 * 60 * 60 * 24)
          );


        const hoursValue =
          Math.floor(
            (
              difference %
              (1000 * 60 * 60 * 24)
            ) /
            (1000 * 60 * 60)
          );


        const minutesValue =
          Math.floor(
            (
              difference %
              (1000 * 60 * 60)
            ) /
            (1000 * 60)
          );


        const secondsValue =
          Math.floor(
            (
              difference %
              (1000 * 60)
            ) /
            1000
          );


        days.textContent =
          String(daysValue).padStart(
            2,
            "0"
          );


        hours.textContent =
          String(hoursValue).padStart(
            2,
            "0"
          );


        minutes.textContent =
          String(minutesValue).padStart(
            2,
            "0"
          );


        seconds.textContent =
          String(secondsValue).padStart(
            2,
            "0"
          );

      }


      updateCountdown();


      setInterval(
        updateCountdown,
        1000
      );

    }


    /* =======================================================
       FLOATING PARTICLES
       ======================================================= */

    function createParticles() {

      const particleCount = 20;


      for (
        let i = 0;
        i < particleCount;
        i++
      ) {

        const particle =
          document.createElement(
            "div"
          );


        particle.className =
          "particle";


        /*
          Every second particle is khaki.
        */

        if (
          i % 2 === 0
        ) {

          particle.classList.add(
            "khaki"
          );

        }


        particle.style.left =
          Math.random() * 100 + "%";


        particle.style.animationDelay =
          Math.random() * 8 + "s";


        particle.style.animationDuration =
          6 +
          Math.random() * 7 +
          "s";


        particle.style.width =
          2 +
          Math.random() * 3 +
          "px";


        particle.style.height =
          particle.style.width;


        document.body.appendChild(
          particle
        );

      }

    }


    createParticles();


    /* =======================================================
       INITIAL FOCUS
       ======================================================= */

    window.addEventListener(
      "load",
      () => {

        passwordInput.focus();

      }
    );


  </script>
